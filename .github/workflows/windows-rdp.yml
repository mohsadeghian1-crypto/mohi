name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall & stable RDP settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          # --- stability hardening for weak/high-latency links ---
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "KeepAlive" -Value 1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fSingleSessionPerUser" -Value 0
          $tcp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $tcp -name "MinEncryptionLevel" -Value 1
          Set-ItemProperty -Path $tcp -name "MaxIdleTime" -Value 0
          Set-ItemProperty -Path $tcp -name "MaxConnectionTime" -Value 0
          Set-ItemProperty -Path $tcp -name "DisconnectedSessionLimit" -Value 0
          Set-ItemProperty -Path $tcp -name "KeepAliveInterval" -Value 1

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Nexouya2026RdpX7" -AsPlainText -Force
          New-LocalUser -Name "NexAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NexAdmin" -ErrorAction SilentlyContinue
          net user NexAdmin Nexouya2026RdpX7

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 10
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NexAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : Nexouya2026RdpX7" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "  SSH channel  : ssh NexAdmin@$ts_ip  (password same)" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Install OpenSSH Server (stable alternative channel)
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction SilentlyContinue
          Start-Service sshd -ErrorAction SilentlyContinue
          Set-Service -Name sshd -StartupType Automatic -ErrorAction SilentlyContinue
          New-NetFirewallRule -Name "OpenSSH-Server" -DisplayName "OpenSSH Server" -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 -ErrorAction SilentlyContinue
          Write-Host "OpenSSH installed."

      - name: 5. Keep Server Alive (6 Hours)
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."
          }